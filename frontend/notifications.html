<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reminders · TravelMate</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="assets/css/fun.css" rel="stylesheet"></head><body>
<div id="bar"></div><header class="top"><a class="logo" href="dashboard.html">✈ TravelMate</a>
<nav aria-label="Main"><a href="dashboard.html">Dashboard</a><a  href="trips.html">Your Trips</a><a class="on" href="notifications.html">Reminders</a></nav>
<div class="d-flex gap-2 align-items-center"><a class="cta" href="trip-new.html">+ New Trip</a><button class="ghost" id="out">Log out</button></div></header>
<main class="pg"><h1 class="rv">Reminders</h1><p class="lead rv" style="--d:.1s">Choose how TravelMate nudges you before you go.</p>
<div class="nf"><form id="f" class="card cream rv" style="--d:.15s"><h3>How to reach you</h3>
<label class="sw" for="notify_email">Email reminders<input class="form-check-input" type="checkbox" role="switch" id="notify_email"></label>
<label class="sw" for="notify_telegram">Telegram reminders<input class="form-check-input" type="checkbox" role="switch" id="notify_telegram"></label>
<label class="mt-3" for="telegram_chat_id">Telegram chat ID</label><input id="telegram_chat_id" class="form-control" placeholder="Only needed for Telegram"><button class="btn-sun">Save preferences</button></form>
<div class="card deep rv" style="--d:.3s"><h3>What we’ve sent</h3><div id="h"></div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="assets/js/api.js"></script><script src="assets/js/app.js"></script>
<script>guard();$('#out').onclick=async()=>{await api('/auth/logout',{method:'POST'});sessionStorage.clear();location.href='login.html'};
const reveal=()=>{const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});$$('.rv:not(.in)').forEach(el=>io.observe(el))};
addEventListener('scroll',()=>{$('#bar').style.width=scrollY/Math.max(1,document.body.scrollHeight-innerHeight)*100+'%'},{passive:true});
api('/notifications/preferences').then(p=>{$('#notify_email').checked=p.notify_email;$('#notify_telegram').checked=p.notify_telegram;$('#telegram_chat_id').value=p.telegram_chat_id||''});
api('/notifications').then(n=>{$('#h').innerHTML=n.map(x=>`<div class="hrow"><span>${esc(x.notification_type)}</span><span class="pill">${esc(x.delivery_status)}</span></div>`).join('')||'<p class="muted">No reminders sent yet. They start 7 days before a trip.</p>';reveal()});
$('#f').onsubmit=async e=>{e.preventDefault();await api('/notifications/preferences',{method:'PUT',body:{notify_email:$('#notify_email').checked,notify_telegram:$('#notify_telegram').checked,telegram_chat_id:$('#telegram_chat_id').value.trim()}});toast('Preferences saved','success')};reveal();</script></body></html>
