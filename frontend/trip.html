<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trip · TravelMate</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet"><link href="assets/css/fun.css" rel="stylesheet"></head>
<body><div class="shell"><div id="nav"></div>
<div id="hd" class="mt-4"></div><div id="st"></div>
<ul class="nav nav-pills my-3" id="tabs"><li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#p1">Itinerary</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#budget">Budget</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#p3">Bookings</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#p4">Map &amp; weather</button></li></ul>
<div class="tab-content"><div class="tab-pane show active" id="p1"></div><div class="tab-pane" id="budget"></div><div class="tab-pane" id="p3"></div><div class="tab-pane" id="p4"></div></div>
</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><script src="assets/js/api.js"></script><script src="assets/js/app.js"></script>
<script>guard();nav('trips');const id=new URLSearchParams(location.search).get('id'),P=`/trips/${id}`;let map;
const links={hotel:'https://www.booking.com',flight:'https://www.skyscanner.co.in',train:'https://www.irctc.co.in',bus:'https://www.redbus.in'};
async function load(){const t=await api(P);$('#hd').innerHTML=`<h3 class="fw-bold">${esc(t.origin)} → ${esc(t.destination)}</h3><p class="text-muted">${t.start_date} to ${t.end_date} · ${t.travellers} traveller(s) · ${inr(t.budget)}</p>`;
 if(t.status==='Processing'){$('#st').innerHTML='<div class="alert alert-warning" role="status">Building your itinerary… this can take a minute.</div>';const iv=setInterval(async()=>{const s=await api(P+'/status');if(s.status!=='Processing'){clearInterval(iv);load()}},2500)}
 else if(t.status==='Failed')$('#st').innerHTML=`<div class="alert alert-danger" role="alert">Itinerary generation failed. <button class="btn btn-sm btn-danger ms-2" id="rt">Retry</button></div>`,$('#rt').onclick=async()=>{await api(P+'/generate',{method:'POST'});load()};
 else $('#st').innerHTML='';
 if(t.status==='Completed'){it();bud();bk();wx()}}
async function it(){const d=await api(P+'/itinerary');$('#p1').innerHTML=d.map(x=>`<div class="c mb-3" data-id="${x.id}"><h6>Day ${x.day_number} · ${esc(x.title)}</h6>${x.items.map((i,n)=>`<div class="d-flex gap-2 mb-2"><input class="form-control form-control-sm w-auto" value="${esc(i.time)}" data-k="time" data-n="${n}" aria-label="Time"><input class="form-control form-control-sm" value="${esc(i.activity)}" data-k="activity" data-n="${n}" aria-label="Activity"><button class="btn btn-sm btn-outline-danger" data-rm="${n}" aria-label="Remove">✕</button></div>`).join('')}<button class="btn btn-sm btn-outline-success" data-save>Save day</button></div>`).join('')+'<button class="btn btn-outline-dark rounded-pill" id="rg">Regenerate itinerary</button>';
 $$('#p1 [data-id]').forEach(c=>{const x=d.find(y=>y.id==c.dataset.id);c.onclick=async e=>{if(e.target.dataset.rm!==undefined){x.items.splice(+e.target.dataset.rm,1)}else if('save' in e.target.dataset){$$('input',c).forEach(i=>x.items[+i.dataset.n][i.dataset.k]=i.value);await api('/itinerary/'+x.id,{method:'PUT',body:x});return toast('Day saved','success')}else return;await api('/itinerary/'+x.id,{method:'PUT',body:x});it()}});
 $('#rg').onclick=async()=>{if(confirm('Replace this itinerary with a new one?')){await api(P+'/generate',{method:'POST'});location.reload()}}}
async function bud(){const [t,e]=await Promise.all([api(P),api(P+'/expenses')]);const s=e.reduce((a,x)=>a+x.amount,0),r=t.budget-s;
 $('#budget').innerHTML=`<div class="c"><h6>Total ${inr(s)} of ${inr(t.budget)} · <span class="${r>=0?'text-success':'text-danger'}">${r>=0?inr(r)+' remaining':inr(-r)+' exceeded'}</span></h6>${e.map(x=>`<div class="row-i border-bottom"><span>${esc(x.category)} · ${esc(x.label)} <span class="${x.is_confirmed?'badge-conf':'badge-est'}">${x.is_confirmed?'Confirmed':'Estimated'}</span></span><b>${inr(x.amount)}</b></div>`).join('')}
 <form id="ef" class="row g-2 mt-2"><div class="col-md-3"><select id="ec" class="form-select">${['transport','accommodation','food','activities','local transport','misc'].map(c=>`<option>${c}</option>`).join('')}</select></div><div class="col-md-3"><input id="el" class="form-control" placeholder="Label" required></div><div class="col-md-2"><input id="ea" type="number" min="1" class="form-control" placeholder="₹" required></div><div class="col-md-2 pt-2"><label><input type="checkbox" id="ek"> Confirmed</label></div><div class="col-md-2"><button class="btn-green w-100">Add</button></div></form></div>`;
 $('#ef').onsubmit=async ev=>{ev.preventDefault();await api(P+'/expenses',{method:'POST',body:{category:$('#ec').value,label:$('#el').value,amount:+$('#ea').value,is_confirmed:$('#ek').checked}});bud()}}
async function bk(){const b=await api(P+'/bookings');$('#p3').innerHTML=`<div class="c mb-3"><h6>Book with a provider</h6><p class="small text-muted">TravelMate doesn’t take payments. These links open the provider’s site.</p>${Object.entries(links).map(([k,u])=>`<a class="btn btn-outline-dark rounded-pill me-2 mb-2" target="_blank" rel="noopener" href="${u}">${k[0].toUpperCase()+k.slice(1)}</a>`).join('')}</div>
 <div class="c"><h6>Saved bookings</h6>${b.map(x=>`<div class="row-i border-bottom"><span>${esc(x.type)} · ${esc(x.provider)} ${esc(x.reference)}</span><span>${inr(x.amount)} · ${esc(x.status)}</span></div>`).join('')||'<p class="small">None yet.</p>'}
 <form id="bf" class="row g-2 mt-2"><div class="col-md-2"><select id="bt" class="form-select">${Object.keys(links).map(k=>`<option>${k}</option>`).join('')}</select></div><div class="col-md-2"><input id="bp" class="form-control" placeholder="Provider" required></div><div class="col-md-2"><input id="br" class="form-control" placeholder="Reference"></div><div class="col-md-2"><input id="ba" type="number" min="0" class="form-control" placeholder="₹"></div><div class="col-md-2"><select id="bs" class="form-select">${['Not Booked','Pending','Confirmed','Cancelled'].map(k=>`<option>${k}</option>`).join('')}</select></div><div class="col-md-2"><button class="btn-green w-100">Save</button></div></form></div>`;
 $('#bf').onsubmit=async ev=>{ev.preventDefault();await api(P+'/bookings',{method:'POST',body:{type:$('#bt').value,provider:$('#bp').value,reference:$('#br').value,amount:+$('#ba').value||0,status:$('#bs').value,date:new Date().toISOString().slice(0,10)}});bk()}}
async function wx(){const [w,pl]=await Promise.all([api(P+'/weather'),api(P+'/places')]);
 $('#p4').innerHTML=`<div class="row g-3"><div class="col-lg-8"><div class="c p-0" style="height:380px"><div id="m2" style="height:100%"></div></div></div><div class="col-lg-4"><div class="c weather"><h6>Weather</h6>${w.available?`<div style="font-size:2.5rem">${w.temp}°</div>${esc(w.condition)} · rain ${w.rain_prob}%<p class="small mt-2 mb-0">${esc(w.suggestion)}</p>`:'Forecast isn’t available for these dates yet.'}</div></div></div>`;
 document.querySelector('[data-bs-target="#p4"]').addEventListener('shown.bs.tab',()=>{if(!map){map=1;drawMap('m2',pl)}})}
load();</script></body></html>
