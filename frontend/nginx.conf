server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index login.html;

    client_max_body_size 3m;

    # Docker's embedded DNS. Resolve "backend" per request (not at startup) so nginx
    # still starts if Flask is briefly down, and recovers when it comes back.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:5000;

    location = / {
        return 302 /login.html;
    }

    # Flask API, same origin as the pages (no CORS, cookies just work).
    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }

    # Uploaded avatars and trip covers are served by Flask.
    location /media/ {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|png|jpe?g|webp|svg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
