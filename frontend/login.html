<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in · TravelMate</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="assets/css/fun.css" rel="stylesheet"></head>
<body><main class="auth c"><h3 class="fw-bold">Plan smarter. Travel better.</h3><p class="text-muted">Log in to open your trips.</p>
<form id="f" novalidate><label class="form-label" for="email">Email</label><input id="email" type="email" class="form-control mb-3" required autocomplete="email">
<label class="form-label" for="pw">Password</label><input id="pw" type="password" class="form-control mb-3" required minlength="8" autocomplete="current-password">
<div id="err" class="text-danger small mb-2" role="alert"></div><button class="btn-green w-100">Log in</button></form>
<p class="small mt-3 mb-0">New here? <a href="register.html">Create an account</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="assets/js/api.js"></script><script src="assets/js/app.js"></script>
<script>$('#f').onsubmit=async e=>{e.preventDefault();const email=$('#email').value.trim(),password=$('#pw').value;
if(!/^\S+@\S+\.\S+$/.test(email))return $('#err').textContent='Enter a valid email address.';
if(password.length<8)return $('#err').textContent='Password must be at least 8 characters.';
const u=await api('/auth/login',{method:'POST',body:{email,password}});sessionStorage.user=JSON.stringify(u);location.href='dashboard.html'}</script></body></html>
